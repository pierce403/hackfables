name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Node deps
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Install matching Chrome for PDF
        run: npx puppeteer browsers install chrome
      - name: Build site with Antora
        run: |
          npm run build:site
      - name: Build PDF and EPUB
        run: |
          npm run build:pdf
          npm run build:epub
      - name: Set Preface as home page
        run: |
          cp build/site/hackfables/preface.html build/site/index.html
          sed -i '0,/<head>/s|<head>|<head>\n  <base href="/hackfables/">|' build/site/index.html
      - name: Place PDF at site root
        run: |
          cp build/book.pdf build/site/HackFables.pdf
      - name: Add CNAME and nojekyll
        run: |
          echo hackfables.org > build/site/CNAME
          touch build/site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-publication:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Read only the exact publishing source files
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const files = ['cloudflare/package.json', 'cloudflare/package-lock.json', 'cloudflare/build-site.mjs', 'cloudflare/mirror-native.mjs', 'cloudflare/extract-pages.py', 'cloudflare/site-config.json', 'wrangler.jsonc'];
            for (const file of files) {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path: file, ref: process.env.SOURCE_SHA });
              if (data.type !== 'file' || data.path !== file || data.encoding !== 'base64') throw new Error('Publishing source mismatch');
              await fs.mkdir(path.dirname(file), { recursive: true });
              await fs.writeFile(file, Buffer.from(data.content, 'base64'));
            }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: tmp/cloudflare-pages-artifact
      - name: Extract the canonical public artifact
        run: python3 cloudflare/extract-pages.py tmp/cloudflare-pages-artifact tmp/cloudflare-public
      - name: Publish validated output for native Cloudflare Git builds
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_SOURCE_REVISION: ${{ github.sha }}
        run: node cloudflare/mirror-native.mjs tmp/cloudflare-public
